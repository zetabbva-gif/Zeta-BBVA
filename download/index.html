<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Descarga ZETA — Redirigiendo a tu tienda de apps</title>
<meta name="description" content="Te estamos redirigiendo a la tienda de apps correspondiente para descargar ZETA, la app de banca de BBVA para jóvenes.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://zeta.bbva.es/download">
<link rel="icon" type="image/png" href="../assets/logo-zeta.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Rubik:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --purple: #7B2EFF;
    --black: #0A0A0A;
    --white: #FFFFFF;
    --font-heading: 'Bricolage Grotesque', 'Segoe UI', sans-serif;
    --font-body: 'Rubik', 'Segoe UI', sans-serif;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--black);
    font-family: var(--font-body);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  .logo {
    height: 40px;
    width: auto;
    margin: 0 auto 24px;
    opacity: 0.9;
  }
  .redirect-text {
    color: var(--white);
    font-size: 15px;
    margin: 0 0 8px;
  }
  .spinner {
    width: 28px;
    height: 28px;
    margin: 0 auto 20px;
    border: 3px solid rgba(255, 255, 255, 0.15);
    border-top-color: var(--purple);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #desktop-fallback {
    display: none;
    margin-top: 32px;
    padding-top: 32px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
  }
  #desktop-fallback h1 {
    font-family: var(--font-heading);
    font-weight: 800;
    font-size: 22px;
    color: var(--white);
    margin: 0 0 24px;
  }
  .store-links {
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .store-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: transparent;
    color: var(--white);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: var(--radius);
    padding: 14px 22px;
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 14px;
    text-decoration: none;
    transition: border-color 0.25s ease;
  }
  .store-btn:hover { border-color: var(--purple); }
  .store-btn:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }

  .fallback-note {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.4);
    margin: 0;
  }
</style>
</head>
<body>

<main>
  <img src="../assets/logo-zeta.png" alt="ZETA" class="logo">

  <div id="redirect-status">
    <div class="spinner" role="status" aria-label="Redirigiendo"></div>
    <p class="redirect-text">Redirigiendo a la app...</p>
  </div>

  <div id="desktop-fallback">
    <h1>Descárgala desde tu dispositivo móvil</h1>
    <div class="store-links">
      <a href="https://apps.apple.com/app/zeta/[ID_APP]" class="store-btn" aria-label="Descargar ZETA en App Store">
        <!-- SUSTITUIR POR ID REAL DE APP STORE -->
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8.79-.15 1.87-.83 3.15-.71 1.53.13 2.68.72 3.42 1.86-3.11 1.88-2.6 5.94.31 7.09-.5 1.38-1.15 2.75-1.96 4.03zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.31-2.06 4.03-3.74 4.25z"/></svg>
        <span>App Store</span>
      </a>
      <a href="https://play.google.com/store/apps/details?id=[PACKAGE_NAME]" class="store-btn" aria-label="Descargar ZETA en Google Play">
        <!-- SUSTITUIR POR PACKAGE NAME REAL DE GOOGLE PLAY -->
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M3.6 2.2c-.4.3-.6.8-.6 1.4v17c0 .6.2 1.1.6 1.4l.1.1L13.6 12 3.7 2.1l-.1.1zm11.3 10.6L5.9 3.8l9.7 9.7-.7.7v.1l.7.7-9.7 9.7 8.9-9zm3.4-6l-2.5-1.4-2.6 2.6 2.6 2.6 2.5-1.4c.8-.5.8-1.9 0-2.4zm-5.1 5.1l2.6 2.6 2.5-1.4c.5-.3.7-.7.8-1.2h-.1c-.1-.5-.3-.9-.8-1.2l-2.5-1.4-2.5 2.6z"/></svg>
        <span>Google Play</span>
      </a>
    </div>
    <p class="fallback-note">Escanea el QR desde tu móvil para descargar directamente.</p>
  </div>
</main>

<script>
(function () {
  'use strict';

  var ua = navigator.userAgent || navigator.vendor || '';
  var APP_STORE_URL = 'https://apps.apple.com/app/zeta/[ID_APP]'; // SUSTITUIR POR ID REAL DE APP STORE
  var GOOGLE_PLAY_URL = 'https://play.google.com/store/apps/details?id=[PACKAGE_NAME]'; // SUSTITUIR POR PACKAGE NAME REAL DE GOOGLE PLAY

  if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
    window.location.href = APP_STORE_URL;
  } else if (/android/i.test(ua)) {
    window.location.href = GOOGLE_PLAY_URL;
  } else {
    document.getElementById('redirect-status').style.display = 'none';
    document.getElementById('desktop-fallback').style.display = 'block';
  }
})();
</script>

</body>
</html>
